# Render's free web service sleeps after ~15 min idle, making the first demo load take ~1 min.
# Ping the health endpoint every 10 minutes so evaluators hit a warm backend.
# GitHub may delay scheduled runs under load, and disables them after 60 days without repo activity.
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 120 --retry 2 https://sih2-backend.onrender.com/api/health
