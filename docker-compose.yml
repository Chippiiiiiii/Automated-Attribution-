services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih_dev_password
      POSTGRES_DB: sih2
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih -d sih2"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
